# Build and publish the AppImage.
#
# Pushing a `v*` tag builds the bundles, signs them with the updater key and
# publishes a release carrying `latest.json` — which is the file the app checks
# on "Check for updates". Without the signature the app refuses the download, so
# a release built without the secret below is worse than no release at all.
#
# Running this by hand (workflow_dispatch) builds the same bundles and uploads
# them as run artifacts without publishing anything, which is how to find out
# that the build is broken without minting a release to prove it.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# tauri-action creates the release and uploads to it.
permissions:
  contents: write

jobs:
  bundle:
    # Note: the AppImage inherits this runner's glibc, so it will not start on a
    # distribution older than the runner. `ubuntu-latest` is the newest, which
    # is the narrowest; drop to `ubuntu-22.04` for a bundle that runs almost
    # anywhere. Nothing else in the file needs to change.
    runs-on: ubuntu-latest

    steps:
      # Full history, not the default shallow clone: the release notes are
      # built from the commits since the previous tag, and neither the tags nor
      # the commits between them exist in a depth-1 checkout.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      # The Rust build is the long pole by a wide margin; keyed on the lockfile
      # so it only rebuilds the world when dependencies actually move.
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # webkit2gtk is the webview, ayatana-appindicator is the tray, rsvg
      # rasterises the icon, and patchelf is what the AppImage bundler uses to
      # rewrite the interpreter paths.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            build-essential \
            patchelf \
            file

      - name: Install JavaScript dependencies
        run: npm ci

      # Build only. Publishing is done below, because the AppImage has to be
      # repaired after it is built and before anything signs it.
      # The key is needed here even though the real signing happens after the
      # repack: `createUpdaterArtifacts` makes the build sign as it bundles, and
      # it fails outright with a pubkey in the config and no private key. The
      # signatures it writes are for the pre-repack AppImage and are replaced
      # below.
      - name: Build the bundles
        uses: tauri-apps/tauri-action@v0
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ""
          args: --bundles appimage,deb

      # The AppImage ships a copy of every library the webview links, and one
      # of them cannot be allowed to win over the host's.
      #
      # `libwayland-client.so.0` is placed ahead of the system copy by AppRun's
      # LD_LIBRARY_PATH. On a distribution whose Mesa is newer than the runner's
      # — which is most of them, and gets worse as this image ages — the two
      # disagree and WebKit dies at startup with:
      #
      #     Could not create default EGL display: EGL_BAD_PARAMETER. Aborting...
      #
      # The window then opens, paints its background colour, and stays empty
      # forever. It looks like a broken app rather than a broken bundle, and it
      # cannot be diagnosed from the window itself. Dropping the bundled copy
      # lets the host's own Wayland client library load, which is the one that
      # matches the host's Mesa. Verified against the 0.1.2 AppImage: removing
      # this file alone turns a black window into a rendered interface.
      - name: Repack the AppImage for the host's Wayland stack
        run: |
          set -euo pipefail
          cd src-tauri/target/release/bundle/appimage
          APP="$(ls ./*.AppImage)"
          ./"$APP" --appimage-extract >/dev/null
          test -f squashfs-root/usr/lib/libwayland-client.so.0 \
            || { echo "::error::bundled libwayland-client.so.0 not found — has the bundler changed?"; exit 1; }
          rm -f squashfs-root/usr/lib/libwayland-client.so.0

          # linuxdeploy's GTK hook hard-codes `export GDK_BACKEND=x11`, citing a
          # 2024 WebKitGTK crash (tauri#8541). The hook is sourced by AppRun, so
          # nothing outside the bundle can override it, and the cost is that
          # every window is an XWayland window.
          #
          # Under a compositor with xwayland:force_zero_scaling, X clients are
          # handed raw pixels and have to scale themselves from one session-wide
          # GDK_SCALE — a single integer, shared by every X client on the
          # desktop. That cannot be correct on two monitors at different scales
          # at once: the app is drawn at 2x on one screen or a fifth too small
          # on another, and no per-window rule exists to fix it, because
          # XWayland is one X server shared by all of them. A Wayland-native
          # window is scaled per output by the compositor and follows a monitor
          # change by itself, so the problem stops existing rather than moving.
          #
          # Verified against WebKitGTK 2.52.5: the crash does not reproduce, the
          # window comes up Wayland-native, and the GStreamer warnings logged at
          # startup are identical on both backends — 15 either way — so nothing
          # here is trading one bug for another.
          #
          # A list rather than a bare `wayland`, so an X11 session still starts,
          # and defaulted rather than assigned, so anyone who does hit a
          # regression can put x11 back from the environment without unpacking
          # the bundle.
          HOOK=squashfs-root/apprun-hooks/linuxdeploy-plugin-gtk.sh
          grep -q '^export GDK_BACKEND=x11' "$HOOK" \
            || { echo "::error::no forced GDK_BACKEND=x11 in the GTK hook — has linuxdeploy changed?"; exit 1; }
          sed -i 's|^export GDK_BACKEND=x11.*|export GDK_BACKEND="${GDK_BACKEND:-wayland,x11}"|' "$HOOK"

          curl -fsSL -o appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          ./appimagetool --appimage-extract-and-run squashfs-root repacked >/dev/null
          mv repacked "$APP"
          rm -rf squashfs-root appimagetool
          echo "repacked $APP"

      # Signing happens here rather than during the build, because the bundle
      # changed after the build. A signature made before the repack would be
      # checked against different bytes and the update would be refused.
      - name: Sign the bundles
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          cd src-tauri/target/release/bundle
          for f in appimage/*.AppImage deb/*.deb; do
            rm -f "$f.sig"
            npx --yes @tauri-apps/cli signer sign \
              --private-key "$TAURI_SIGNING_PRIVATE_KEY" \
              --password "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" \
              "$f"
            test -s "$f.sig" || { echo "::error::no signature written for $f"; exit 1; }
          done

      # `latest.json` is what the app reads on "Check for updates", and it is
      # written by hand for the same reason the signing is: tauri-action would
      # have described the pre-repack bundle.
      #
      # The URL uses dots where the filename has spaces, because that is what
      # GitHub renames the asset to on upload. Getting this wrong produces a
      # release that looks correct and an updater that 404s.
      - name: Write latest.json
        if: github.ref_type == 'tag'
        run: |
          set -euo pipefail
          cd src-tauri/target/release/bundle
          VERSION="$(node -p "require('$GITHUB_WORKSPACE/src-tauri/tauri.conf.json').version")"
          APP="$(basename ./appimage/*.AppImage)"
          ASSET="${APP// /.}"
          SIG="$(cat ./appimage/*.AppImage.sig)"
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/${ASSET}"
          node -e '
            const [version, signature, url] = process.argv.slice(1);
            const platform = { signature, url };
            process.stdout.write(JSON.stringify({
              version,
              notes: "See the release notes.",
              pub_date: new Date().toISOString(),
              platforms: {
                "linux-x86_64": platform,
                "linux-x86_64-appimage": platform,
              },
            }, null, 2));
          ' "$VERSION" "$SIG" "$URL" > latest.json
          cat latest.json

      # Notes are assembled rather than fixed, so a release says what actually
      # changed in it. The list is every commit since the previous tag, taken
      # from the repository itself — there is no changelog file to forget to
      # update, and nothing to keep in step by hand.
      #
      # Reverted work still appears, as both the change and its revert. That is
      # accurate rather than tidy: inventing a filter for it would mean guessing
      # which commits cancel out, and guessing wrong hides real changes.
      - name: Write the release notes
        if: github.ref_type == 'tag'
        run: |
          set -euo pipefail
          PREV="$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)"
          if [ -n "$PREV" ]; then
            RANGE="${PREV}..${GITHUB_REF_NAME}"
            HEADING="Changes since ${PREV}"
          else
            RANGE="${GITHUB_REF_NAME}"
            HEADING="Changes"
          fi
          {
            echo "A local desktop music player for long coding sessions."
            echo
            echo "## ${HEADING}"
            echo
            git log --no-merges --pretty=format:'- %s' "$RANGE"
            echo
            echo
            echo "## Install"
            echo
            echo 'Download the `.AppImage`, make it executable and run it:'
            echo
            echo '```bash'
            echo 'chmod +x Music*AI*Player_*.AppImage'
            echo './Music*AI*Player_*.AppImage'
            echo '```'
            echo
            echo "Installed builds update themselves from here — Settings → Updates."
          } > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"

      - name: Publish the release
        if: github.ref_type == 'tag'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd src-tauri/target/release/bundle
          gh release create "$GITHUB_REF_NAME" \
            --title "Music AI Player ${GITHUB_REF_NAME#v}" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            latest.json \
            appimage/*.AppImage appimage/*.AppImage.sig \
            deb/*.deb deb/*.deb.sig

      # Only reached on a manual run, where nothing was published.
      - name: Upload bundles as artifacts
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: bundles
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage*
            src-tauri/target/release/bundle/deb/*.deb
