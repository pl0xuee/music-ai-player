[package]
name = "music-ai-player"
version = "0.1.0"
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `tray-icon` pulls in the system tray; `image-png` lets us decode the bundled
# PNG icon for the tray at runtime.
tauri = { version = "2", features = ["protocol-asset", "tray-icon", "image-png"] }
tauri-plugin-global-shortcut = "2"
# The folder picker for adopting local audio, and for choosing where downloads
# land. Drag-and-drop needs nothing.
#
# `xdg-portal` rather than the default `gtk3`. The default builds rfd's own
# GtkFileChooser, whose sidebar is only ever the XDG user directories — a NAS
# share, an external disk, anything under /mnt is unreachable without knowing
# to dig through "Other Locations", and mounted network places are not listed
# at all. Going through xdg-desktop-portal hands the request to the desktop's
# real file dialog (KDE's here), which lists the same places the file manager
# does, including the network.
tauri-plugin-dialog = { version = "2", default-features = false, features = ["xdg-portal"] }

# Self-update from the GitHub release. AppImage is the shipping target: the
# updater swaps the running image in place, and `process` relaunches it so the
# new one is what comes back.
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

# MPRIS, written directly against zbus in `mpris.rs`. Already in the tree via
# the desktop portal, and compiled with its tokio feature — which is exactly
# why the obvious crate for this could not work here.
zbus = "5"

serde = { version = "1", features = ["derive"] }
# yt-dlp reports each item as a one-line JSON object on stdout; see youtube.rs.
serde_json = "1"
rusqlite = { version = "0.40", features = ["bundled"] }

# The loopback media server in `stream.rs`. Both of these are already in the
# tree as transitive dependencies of Tauri's own HTTP stack, so naming them here
# adds nothing to the build — it only stops us from hand-rolling the two pieces
# of parsing that are worth getting exactly right. `http-range` in particular
# implements RFC 7233's awkward split, where a malformed Range must be ignored
# but an unsatisfiable one must be refused with a 416.
httparse = "1"
http-range = "0.1"

# Signalling a *process group* (SIGINT for a clean, resumable cancel; SIGKILL as
# the backstop) and PR_SET_PDEATHSIG both need raw syscalls that std does not
# expose. See `engine::proc`.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# `test` gives the mock runtime the engine end-to-end test drives, so the whole
# spawn -> health-check -> progress -> cancel path runs without a display.
[dev-dependencies]
tauri = { version = "2", features = ["test"] }
