# ------------------------------------------------------------------------------
# Shared pools — these define the constant character of the whole library.
# ------------------------------------------------------------------------------
[modifiers]
mood = [
  "bleak", "menacing", "brooding", "oppressive", "cold", "desolate",
  "claustrophobic", "foreboding", "sombre", "grim", "austere", "shadowy",
  "dystopian", "clandestine", "nocturnal", "sinister", "clinical", "remote",
]

# Deep low end in EVERY caption. Non-negotiable.
bass = [
  "An enormous sub-bass in the lowest octave dominates everything, felt in the chest rather than heard.",
  "The entire track sits on a colossal 30 Hz sub-bass drone that never lets up.",
  "A cavernous, room-shaking sub-bass fills the very bottom of the spectrum, thick and enveloping.",
  "Crushing infrasonic sub-bass frequencies dominate the mix, deep and almost inaudible in pitch.",
  "An immense low-frequency foundation anchors the track, so deep it is felt more than heard.",
  "The sub-bass is vast and overwhelming, pitched far below the rest of the arrangement.",
  "A monstrous sub-bass drone underpins everything, sitting an octave below the bassline.",
  "Long, sustained sub-bass tones roll underneath like tectonic movement.",
  "The deepest sub-bass is the loudest element by far, a constant subterranean pressure.",
  "A bottomless low-end drone dominates the mix, weighted entirely toward the sub register.",
]

# Ambient synth bed in EVERY caption — atmosphere UNDER the beat, never
# replacing it. This is what makes it "ambient" without making it beatless.
