# ==============================================================================
# Prompt bank — the single source of truth for what the library sounds like.
#
# TARGET: dark cyberpunk / tech-noir for coding sessions. ONE coherent station
# sound, not a genre sampler.
#
# This is the second structure. The first spanned eight genres (dark techno,
# hardstyle, acid, EBM, ...) and that was the core error: the reference is a
# single consistent sound with internal variation, so a genre sampler wandered
# off target no matter how well any individual track came out. The four
# "genres" below are deliberately close relatives — different weightings of the
# same palette, not different music.
#
# Every track, without exception:
#   · steady driving beat            · enormous deep sub-bass
#   · ambient synth pad underneath   · dystopian / neon / tech-noir mood
#   · fully instrumental             · slow tempo (74–100 BPM)
#
# ---- TEMPO / SPECTRUM ARE MEASURED, NOT GUESSED -------------------------------
# The reference stream was analysed with scratchpad/analyze2.py (per-octave dB
# relative to peak, so the 1/f tilt common to all music cancels out — raw energy
# percentages are useless here, they "match" for any two pieces of music).
#
#                        reference    ours (v6)
#   tempo candidates     78 and 99    65 / 78      <- 68-90 was OVER-corrected
#   octave peak          31 Hz        62 Hz        <- ours one octave too high
#   spectral centroid    1652 Hz      2018 Hz      <- ours too bright
#   rolloff 85%          4212 Hz      5692 Hz
#   flatness             0.364        0.423
#   percussive frac      0.058        0.050        ok
#
# Two fixes, both verified by re-measuring:
#   1. bpm ranges now straddle the measured 78/99 pair.
#   2. The octave and brightness gaps are corrected DETERMINISTICALLY by the
#      mastering chain in generate.py (MASTER_CHAIN), not by asking the model
#      for "infrasonic sub-bass" and hoping. After mastering: centroid 1708 Hz,
#      flatness 0.376, worst octave gap 6.5 dB -> 3.9 dB.
#
# Re-measure after any change:
#   venv_rocm/bin/python scratchpad/analyze2.py <reference.mp3> <our_dir>/
#
# ---- WHY THIS IS PROSE, NOT TAGS ---------------------------------------------
# ACE-Step was trained on rich prose captions (see examples/text2music/).
# A comma-separated tag list is out-of-distribution and produces incoherent
# mush. Captions are assembled from sentence fragments:
#
#   "A {mood}, {mood} {genre_phrase} at {bpm} BPM. {foundation} {bass}
#    {atmosphere} {mid_layer} {development} The production is {production}.
#    The overall mood is {closing}. Fully instrumental with no vocals."
#
# ---- TUNING GUIDE ------------------------------------------------------------
#   too samey       -> add `mid_layer` / `development` fragments
#   not dark        -> darken `closing` and `mood`
#   too fast        -> lower `bpm` ranges
#   beat too weak   -> weight `cyberpunk techno` up, `deep cyberpunk` down
#   not atmospheric -> add to the shared `atmosphere` pool
#
# Fragments must be grammatical standalone sentences (except `genre_phrase`,
# `production` and the mood pools) — they are concatenated verbatim.
# ==============================================================================

[defaults]
# NOT opus: torchaudio 2.10 delegates encoding to torchcodec (not installed)
# and the soundfile fallback can't write an OPUS container, so the render
# succeeds but the file write fails silently. mp3 is ~3.2 MB per 200 s track.
audio_format   = "mp3"
audio_duration = 200          # 3:20 — 432 of these ≈ 24 h
model          = "acestep-v15-turbo"
seed           = -1
lyrics         = ""           # EMPTY ⇒ instrumental. Do not populate.

# Minor keys throughout, skewed low and dark.
[[key]]
name = "F Minor"
weight = 20
[[key]]
name = "D Minor"
weight = 17
[[key]]
name = "C Minor"
weight = 16
[[key]]
name = "G Minor"
weight = 14
[[key]]
name = "A Minor"
weight = 12
[[key]]
name = "Bb Minor"
weight = 11
[[key]]
name = "Eb Minor"
weight = 10

# ------------------------------------------------------------------------------
# Track titles — cosmetic only, the model never sees these. Tech-noir register
# to match the library.
# ------------------------------------------------------------------------------
