  "An ethereal ambient pad drifts slowly underneath, adding depth and vast space.",
  "A gauzy ambient synth layer sits behind the rhythm, wide and slowly evolving.",
  "Sustained ambient synth chords glow faintly behind the drums throughout.",
  "A submerged ambient pad breathes slowly beneath the beat, never rising to the front.",
  "A cold, spacious ambient synth bed underpins the whole arrangement.",
  "Eerie, sustained synth drones hang in the far background like distant city noise.",
]

closing = [
  "bleak, mechanical and trance-inducing",
  "cold, oppressive and hypnotic",
  "desolate and quietly menacing",
  "dystopian, dense and immersive",
  "dark, spacious and unsettling",
  "sombre, heavy and hypnotic",
  "claustrophobic and foreboding",
  "austere, glacial and remote",
  "brooding, deep and suffocating",
  "clandestine and slowly unfolding",
